name: Disable About card text selection

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable selection inside Card 1 without blocking clicks
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('cards/card-01.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          <style id="card-no-selection">
          html, body, body *{
            user-select:none !important;
            -webkit-user-select:none !important;
            -ms-user-select:none !important;
            -webkit-touch-callout:none !important;
          }
          img, svg{
            -webkit-user-drag:none !important;
            user-drag:none !important;
          }
          /* Keep interaction available for the clickable areas we add later. */
          a, button, [role="button"], [data-clickable], [data-no-card-swipe]{
            pointer-events:auto !important;
            cursor:pointer;
          }
          </style>
          '''

          script = r'''
          <script id="card-no-selection-script">
          (() => {
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.querySelectorAll('img').forEach(img => img.setAttribute('draggable','false'));
          })();
          </script>
          '''

          if 'id="card-no-selection"' in html:
              html = re.sub(r'<style id="card-no-selection">.*?</style>', css.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</head>', css + '\n</head>', 1)

          if 'id="card-no-selection-script"' in html:
              html = re.sub(r'<script id="card-no-selection-script">.*?</script>', script.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</body>', script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit selection fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Disable text selection inside Card 1"
            git push
          fi
