name: Fix Card 1 frame alignment

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Card 1 fit the carousel shell exactly
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Parent carousel: iframe itself must exactly match the card shell.
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          parent_css = r'''
          <style id="card1-exact-frame-fix">
          .about-card.html-filled > iframe{
            position:absolute !important;
            inset:0 !important;
            width:100% !important;
            height:100% !important;
            max-width:none !important;
            max-height:none !important;
            border:0 !important;
            background:transparent !important;
            overflow:hidden !important;
            pointer-events:none !important;
          }
          .about-card.html-filled::before{
            inset:0 !important;
          }
          </style>
          '''
          if 'id="card1-exact-frame-fix"' in html:
              html = re.sub(r'<style id="card1-exact-frame-fix">.*?</style>', parent_css.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</head>', parent_css + '\n</head>', 1)
          html = re.sub(r'src="cards/card-01\.html(?:\?[^\"]*)?"', 'src="cards/card-01.html?v=20260915-1416"', html, count=1)
          p.write_text(html, encoding='utf-8')

          # 2) Card document: fit the true 2945 x 4962 card body directly to the iframe.
          p = Path('cards/card-01.html')
          card = p.read_text(encoding='utf-8')
          card_css = r'''
          <style id="embedded-card-fit-css">
          html, body{
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            margin:0 !important;
            padding:0 !important;
            overflow:hidden !important;
            background:transparent !important;
            display:block !important;
          }
          .viewport{
            position:relative !important;
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            overflow:hidden !important;
            transform:none !important;
            transform-origin:top left !important;
            zoom:1 !important;
          }
          .content-layer{
            position:absolute !important;
            left:0 !important;
            top:0 !important;
            width:2992.93px !important;
            height:4962px !important;
            transform-origin:top left !important;
          }
          </style>
          '''
          card_js = r'''
          <script id="embedded-card-fit">
          (() => {
            const CARD_W = 2945;
            const CARD_H = 4962;
            const layer = document.querySelector('.content-layer');
            if (!layer) return;
            const fit = () => {
              const w = window.innerWidth || CARD_W;
              const h = window.innerHeight || CARD_H;
              const s = Math.min(w / CARD_W, h / CARD_H);
              layer.style.transform = `scale(${s})`;
            };
            fit();
            window.addEventListener('resize', fit, {passive:true});
          })();
          </script>
          '''
          card = re.sub(r'<style id="embedded-card-fit-css">.*?</style>', card_css.strip(), card, count=1, flags=re.S)
          card = re.sub(r'<script id="embedded-card-fit">.*?</script>', card_js.strip(), card, count=1, flags=re.S)
          p.write_text(card, encoding='utf-8')

      - name: Commit frame fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cards/card-01.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix Card 1 frame alignment"
            git push
          fi
