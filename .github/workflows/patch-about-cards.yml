name: Fix About active card shadow

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add hard orange shadow layer to active filled card
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          <style id="about-active-hard-shadow">
          .about-card.html-filled,
          .about-card.image-filled{
            overflow:visible !important;
            background:transparent !important;
            box-shadow:none !important;
          }

          .about-card.html-filled::before,
          .about-card.image-filled::before{
            content:"";
            position:absolute;
            inset:0;
            border-radius:inherit;
            background:#F5A833;
            transform:translate(18px,20px);
            opacity:0;
            pointer-events:none;
            z-index:0;
          }

          .about-card[data-depth="0"].html-filled::before,
          .about-card[data-depth="0"].image-filled::before{
            opacity:1 !important;
          }

          .about-card.html-filled > iframe,
          .about-card.image-filled > img{
            z-index:2 !important;
          }

          .about-card.html-filled > iframe{
            position:absolute !important;
          }

          .about-card.image-filled > img{
            position:relative !important;
          }
          </style>
          '''

          if 'id="about-active-hard-shadow"' in html:
              html = re.sub(r'<style id="about-active-hard-shadow">.*?</style>', css.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</head>', css + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit hard shadow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add hard orange shadow to active About card"
            git push
          fi
