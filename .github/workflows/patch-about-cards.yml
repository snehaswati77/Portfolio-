name: Sharpen Card 1 HTML rendering

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace transform scaling with CSS zoom inside Card 1
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('cards/card-01.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          <style id="embedded-card-fit-css">
          html, body{
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            margin:0 !important;
            padding:0 !important;
            overflow:hidden !important;
            background:transparent !important;
          }
          body{
            display:flex !important;
            align-items:center !important;
            justify-content:center !important;
          }
          .viewport{
            position:relative !important;
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            overflow:visible !important;
            transform:none !important;
            zoom:1 !important;
          }
          .content-layer{
            position:relative !important;
            left:auto !important;
            top:auto !important;
            width:3036px !important;
            height:5040px !important;
            transform:none !important;
            transform-origin:top left !important;
            flex:none !important;
          }
          </style>
          '''

          script = r'''
          <script id="embedded-card-fit">
          (() => {
            const BASE_W = 3036;
            const BASE_H = 5040;
            const SAFE_FACTOR = 1.08;
            const layer = document.querySelector('.content-layer');
            if (!layer) return;

            const fit = () => {
              const w = window.innerWidth || document.documentElement.clientWidth || BASE_W;
              const h = window.innerHeight || document.documentElement.clientHeight || BASE_H;
              const scale = Math.min(
                w / (BASE_W * SAFE_FACTOR),
                h / (BASE_H * SAFE_FACTOR)
              );

              /* CSS zoom preserves text/vector rasterization better than
                 transform:scale() at these very small fractional sizes. */
              layer.style.zoom = String(scale);
              layer.style.transform = 'none';
            };

            fit();
            window.addEventListener('resize', fit, {passive:true});
          })();
          </script>
          '''

          if 'id="embedded-card-fit-css"' in html:
              html = re.sub(r'<style id="embedded-card-fit-css">.*?</style>', css.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</head>', css + '\n</head>', 1)

          if 'id="embedded-card-fit"' in html:
              html = re.sub(r'<script id="embedded-card-fit">.*?</script>', script.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</body>', script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit sharper render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Sharpen Card 1 HTML rendering"
            git push
          fi
