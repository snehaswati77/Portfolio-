name: Patch About card 1 HTML

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Card 1 embedded scaling
        shell: python
        run: |
          from pathlib import Path
          import re

          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')

          # Remove any old iframe fit script so scaling is applied only once.
          card = re.sub(
              r'\s*<script id="embedded-card-fit">.*?</script>\s*',
              '\n',
              card,
              count=1,
              flags=re.S,
          )

          # Neutralize the standalone preview zoom.
          card = re.sub(r'zoom:\s*[^;]+;', 'zoom: 1 !important;', card)

          fit_css = r'''
          <style id="embedded-card-fit-css">
            html, body {
              width: 100% !important;
              height: 100% !important;
              min-height: 0 !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              background: transparent !important;
              display: block !important;
            }
            .viewport {
              position: relative !important;
              width: 100% !important;
              height: 100% !important;
              min-height: 0 !important;
              overflow: hidden !important;
              transform: none !important;
              zoom: 1 !important;
            }
            .content-layer {
              position: absolute !important;
              left: 50% !important;
              top: 50% !important;
              width: 3036px !important;
              height: 5040px !important;
              transform-origin: center center !important;
            }
          </style>
          '''

          # Replace prior override if present, otherwise append before </head>.
          if 'id="embedded-card-fit-css"' in card:
              card = re.sub(r'<style id="embedded-card-fit-css">.*?</style>', fit_css.strip(), card, count=1, flags=re.S)
          else:
              card = card.replace('</head>', fit_css + '\n</head>', 1)

          fit_script = r'''
          <script id="embedded-card-fit">
          (() => {
            const BASE_W = 3036;
            const BASE_H = 5040;
            const layer = document.querySelector('.content-layer');
            if (!layer) return;

            const fit = () => {
              const w = window.innerWidth || document.documentElement.clientWidth || BASE_W;
              const h = window.innerHeight || document.documentElement.clientHeight || BASE_H;
              const scale = Math.min(w / BASE_W, h / BASE_H);
              layer.style.transform = `translate(-50%, -50%) scale(${scale})`;
            };

            fit();
            window.addEventListener('resize', fit, { passive: true });
          })();
          </script>
          '''
          card = card.replace('</body>', fit_script + '\n</body>', 1)
          card_path.write_text(card, encoding='utf-8')

      - name: Commit scaling fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix Card 1 embedded scaling"
            git push
          fi
