name: Force refresh restored Card 1

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-bust Card 1 iframe after rollback
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Keep the restored Card 1 implementation exactly as-is; only force
          # browsers/GitHub Pages to request the current HTML instead of a cached copy.
          html = re.sub(
              r'src="cards/card-01\.html(?:\?[^\"]*)?"',
              'src="cards/card-01.html?v=20260915-1409"',
              html,
              count=1,
          )

          path.write_text(html, encoding='utf-8')

      - name: Commit cache-bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Force refresh restored Card 1"
            git push
          fi
