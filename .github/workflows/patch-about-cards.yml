name: Normalize replacement Card 1 canvas

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Card 1 safe canvas and transparency
        shell: python
        run: |
          from pathlib import Path
          import re

          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')

          # Keep the fresh export intact, but normalize its outer canvas for iframe use.
          # The export canvas is 3023x5040 while the actual card body is 2945x4962,
          # which leaves 39px of safe room on each side when centered.
          css = r'''
          <style id="card1-embed-normalize">
          html, body{
            margin:0 !important;
            padding:0 !important;
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            overflow:hidden !important;
            display:block !important;
            background:transparent !important;
          }
          .viewport{
            position:relative !important;
            width:3023px !important;
            height:5040px !important;
            min-height:5040px !important;
            transform-origin:0 0 !important;
            flex:0 0 auto !important;
            background:transparent !important;
          }
          .content-layer{
            position:absolute !important;
            left:39px !important;
            top:39px !important;
            width:2945px !important;
            height:4962px !important;
            background:transparent !important;
          }
          </style>
          '''

          if 'id="card1-embed-normalize"' in card:
              card = re.sub(r'<style id="card1-embed-normalize">.*?</style>', css.strip(), card, count=1, flags=re.S)
          else:
              card = card.replace('</head>', css + '\n</head>', 1)

          card_path.write_text(card, encoding='utf-8')

          # Keep carousel geometry untouched. Only force a fresh iframe load.
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(
              r'src="cards/card-01\.html(?:\?[^\"]*)?"',
              'src="cards/card-01.html?v=20260915-1458"',
              html,
              count=1,
          )
          index_path.write_text(html, encoding='utf-8')

      - name: Commit Card 1 canvas normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Normalize replacement Card 1 canvas"
            git push
          fi
