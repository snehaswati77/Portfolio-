name: Restore Card 1 drag

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Let carousel own drag gestures over Card 1
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          <style id="card1-drag-bridge-fix">
          /* The iframe is visual content only. Pointer gestures go to the
             parent carousel so Card 1 drags exactly like the PNG cards. */
          .about-card.html-filled > iframe{
            pointer-events:none !important;
            user-select:none !important;
            -webkit-user-select:none !important;
          }

          /* Future Card 1 interactions should be parent-level hotspots layered
             above the iframe. These remain clickable without blocking drag elsewhere. */
          .about-card.html-filled > .card-hotspot,
          .about-card.html-filled > [data-card-hotspot]{
            position:absolute;
            z-index:5;
            pointer-events:auto !important;
            touch-action:manipulation;
            cursor:pointer;
          }
          </style>
          '''

          if 'id="card1-drag-bridge-fix"' in html:
              html = re.sub(r'<style id="card1-drag-bridge-fix">.*?</style>', css.strip(), html, count=1, flags=re.S)
          else:
              html = html.replace('</head>', css + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit drag fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Restore Card 1 carousel dragging"
            git push
          fi
