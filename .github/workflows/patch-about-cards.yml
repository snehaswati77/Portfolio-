name: Fix replacement Card 1 fit

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Card 1 internal flex sizing and outer iframe fit
        shell: python
        run: |
          from pathlib import Path
          import re

          # --- Fix the freshly uploaded Card 1 export itself ---
          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')

          # The exported .viewport is a flex item. Without flex:0 0 auto,
          # the browser shrinks its 3023px layout box before applying the
          # export's transform scale, which shifts the artwork to the right.
          card = re.sub(
              r'(\.viewport\s*\{\s*width:\s*3023px;\s*min-height:\s*5040px;\s*transform-origin:\s*top center;)(\s*\})',
              r'\1\n        flex: 0 0 auto;\2',
              card,
              count=1,
              flags=re.S,
          )
          card_path.write_text(card, encoding='utf-8')

          # --- Clean final fit override in the carousel shell ---
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          fit_css = r'''
          <style id="card1-replacement-fit-final">
          /* Final authority for the fresh Card 1 export. Old 108% safe-canvas
             rules stay harmless underneath this override. */
          .about-card.html-filled > iframe{
            position:absolute !important;
            inset:0 !important;
            left:0 !important;
            top:0 !important;
            width:100% !important;
            height:100% !important;
            max-width:none !important;
            max-height:none !important;
            border:0 !important;
            background:transparent !important;
            overflow:hidden !important;
            pointer-events:none !important;
          }

          /* Match Card 1's active hard shadow to the same shell geometry as PNG cards. */
          .about-card.html-filled::before{
            inset:0 !important;
          }
          </style>
          '''

          if 'id="card1-replacement-fit-final"' in html:
              html = re.sub(
                  r'<style id="card1-replacement-fit-final">.*?</style>',
                  fit_css.strip(),
                  html,
                  count=1,
                  flags=re.S,
              )
          else:
              html = html.replace('</head>', fit_css + '\n</head>', 1)

          # Force the iframe to request this corrected Card 1.
          html = re.sub(
              r'src="cards/card-01\.html(?:\?[^\"]*)?"',
              'src="cards/card-01.html?v=20260915-1452"',
              html,
              count=1,
          )

          index_path.write_text(html, encoding='utf-8')

      - name: Commit fit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix replacement Card 1 fit"
            git push
          fi
