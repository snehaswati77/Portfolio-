name: Patch About card 1 HTML

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Card 1 HTML into About carousel
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          styles = r'''
          <style id="about-html-card-styles">
          .about-card.html-filled{
            background:transparent !important;
            border:0 !important;
            box-shadow:none !important;
            overflow:visible !important;
          }
          .about-card.html-filled::after{display:none !important;}
          .about-card.html-filled > iframe{
            display:block;
            width:100%;
            height:100%;
            border:0;
            background:transparent;
            overflow:hidden;
          }
          </style>
          '''

          if 'id="about-html-card-styles"' not in html:
              html = html.replace('</head>', styles + '\n</head>', 1)

          card1 = '<article aria-label="About card 1" class="about-card html-filled" data-card="1"><iframe src="cards/card-01.html" title="Sneha Swati Character Card" scrolling="no" loading="eager"></iframe></article>'
          html, n1 = re.subn(
              r'<article\s+aria-label="About card 1"[^>]*data-card="1"[^>]*>.*?</article>',
              card1,
              html,
              count=1,
              flags=re.S,
          )
          if n1 != 1:
              raise SystemExit(f'Expected one Card 1 match; got {n1}')
          index_path.write_text(html, encoding='utf-8')

          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')
          card = re.sub(r'zoom:\s*0\.3\s*;', 'zoom: 1;', card, count=1)
          fit_script = r'''
          <script id="embedded-card-fit">
          (() => {
            const BASE_W = 3036;
            const viewport = document.querySelector('.viewport');
            if (!viewport) return;
            const fit = () => {
              const w = document.documentElement.clientWidth || window.innerWidth || BASE_W;
              viewport.style.zoom = String(w / BASE_W);
            };
            fit();
            window.addEventListener('resize', fit, {passive:true});
          })();
          </script>
          '''
          if 'id="embedded-card-fit"' not in card:
              card = card.replace('</body>', fit_script + '\n</body>', 1)
          card_path.write_text(card, encoding='utf-8')

      - name: Commit patched About card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cards/card-01.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Use Card 1 HTML in About carousel"
            git push
          fi
