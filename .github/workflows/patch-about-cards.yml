name: Fix Card 1 internal fit

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fit Card 1 body to iframe without clipping
        shell: python
        run: |
          from pathlib import Path
          import re

          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')

          css = r'''
          <style id="card1-embed-normalize">
          html,body{
            margin:0 !important;
            padding:0 !important;
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            overflow:visible !important;
            display:block !important;
            background:transparent !important;
          }
          .viewport{
            position:absolute !important;
            left:0 !important;
            top:0 !important;
            width:2945px !important;
            height:4962px !important;
            min-height:4962px !important;
            transform-origin:0 0 !important;
            flex:none !important;
            background:transparent !important;
            overflow:visible !important;
          }
          .content-layer{
            position:absolute !important;
            left:0 !important;
            top:0 !important;
            width:2945px !important;
            height:4962px !important;
            background:transparent !important;
            overflow:visible !important;
          }
          </style>
          '''
          if 'id="card1-embed-normalize"' in card:
              card = re.sub(r'<style id="card1-embed-normalize">.*?</style>', css.strip(), card, count=1, flags=re.S)
          else:
              card = card.replace('</head>', css + '\n</head>', 1)

          # Force the export's own responsive scaler to use the actual card body.
          card = re.sub(r'var\s+baseWidth\s*=\s*\d+(?:\.\d+)?\s*;', 'var baseWidth = 2945;', card)
          card = re.sub(r'const\s+baseWidth\s*=\s*\d+(?:\.\d+)?\s*;', 'const baseWidth = 2945;', card)
          card_path.write_text(card, encoding='utf-8')

          # Cache-bust only. Do not alter carousel transforms/sizing.
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'src="cards/card-01\.html(?:\?[^\"]*)?"', 'src="cards/card-01.html?v=20260915-1542"', html, count=1)
          index_path.write_text(html, encoding='utf-8')

      - name: Commit Card 1 fit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix Card 1 internal fit and clipping"
            git push
          fi
