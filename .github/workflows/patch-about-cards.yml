name: Map replacement Card 1 exactly to shell

on:
  push:
    paths:
      - '.github/workflows/patch-about-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove export safe canvas and fit true card body
        shell: python
        run: |
          from pathlib import Path
          import re

          card_path = Path('cards/card-01.html')
          card = card_path.read_text(encoding='utf-8')

          # The actual exported card is exactly 2945 x 4962 and already starts at 0,0.
          # Remove the larger 3023 x 5040 preview canvas entirely so the iframe maps
          # one-to-one to the carousel shell and cannot show rectangular gutters.
          css = r'''
          <style id="card1-embed-normalize">
          html, body{
            margin:0 !important;
            padding:0 !important;
            width:100% !important;
            height:100% !important;
            min-height:0 !important;
            overflow:hidden !important;
            display:block !important;
            background:transparent !important;
          }
          .viewport{
            position:relative !important;
            width:2945px !important;
            height:4962px !important;
            min-height:4962px !important;
            transform-origin:0 0 !important;
            flex:0 0 auto !important;
            background:transparent !important;
          }
          .content-layer{
            position:relative !important;
            left:0 !important;
            top:0 !important;
            width:2945px !important;
            height:4962px !important;
            background:transparent !important;
          }
          </style>
          '''

          if 'id="card1-embed-normalize"' in card:
              card = re.sub(r'<style id="card1-embed-normalize">.*?</style>', css.strip(), card, count=1, flags=re.S)
          else:
              card = card.replace('</head>', css + '\n</head>', 1)

          # Make the export's own fit script use the true card width, not the old
          # preview-canvas width. This changes only internal fit, not carousel geometry.
          card = re.sub(r'var\s+baseWidth\s*=\s*3023\s*;', 'var baseWidth = 2945;', card, count=1)

          card_path.write_text(card, encoding='utf-8')

          # Keep the carousel/card transforms untouched; only force a fresh Card 1 load.
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(
              r'src="cards/card-01\.html(?:\?[^\"]*)?"',
              'src="cards/card-01.html?v=20260915-1501"',
              html,
              count=1,
          )
          index_path.write_text(html, encoding='utf-8')

      - name: Commit exact Card 1 mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/card-01.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Map replacement Card 1 exactly to shell"
            git push
          fi
