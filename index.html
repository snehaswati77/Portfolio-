<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Sneha About — Corrected Bridge Card 1</title>
<style>

:root{
  --card-bg:#fff;
  --card-border:#d9d9d9;
  --radius:28px;
  --stack-gap:10px;
  --s1:.985;
  --s2:.970;
  --s3:.955;

  /* Temporary approximation until exact Figma shadow values are supplied */
  --shadow-x:12px;
  --shadow-y:14px;
  --shadow-blur:0px;
  --shadow-color:#f5aa2f;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#f7f7f7;
  font-family:Arial,Helvetica,sans-serif;
}

body{min-height:100vh}

.about-card-module{
  width:100%;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  overflow:hidden;
}

.about-card-stage{
  position:relative;
  width:100%;
  display:grid;
  place-items:center;
  overflow:visible;
  touch-action:pan-y;
  outline:none;
}

/* MASTER CARD GEOMETRY
   Figma: 2945 × 4962
   This is a portrait / vertical ratio. */
.about-card-stack{
  position:relative;
  height:min(72vh, 760px);
  aspect-ratio:2945 / 4962;
  width:auto;
}

.about-card{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:1px solid #d6d6d6;
  border-radius:var(--radius);
  background:var(--card-bg);
  box-shadow:10px 12px 0 var(--shadow-color), 0 14px 28px rgba(0,0,0,.10);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  will-change:transform,opacity;
  transition:
    transform 360ms cubic-bezier(.18,.86,.22,1),
    opacity 220ms ease;
}

.about-card[data-depth="0"]{
  z-index:50;
  transform:translate3d(0,0,0) scale(1);
  opacity:1;
  pointer-events:auto;
}

.about-card[data-depth="1"]{
  z-index:40;
  transform:
    translate3d(calc(-22px + var(--pile-jx,0px)),calc(-10px + var(--pile-jy,0px)),0)
    rotate(calc(-2.1deg + var(--pile-jr,0deg)))
    scale(.995);
  transform-origin:62% 88%;
  opacity:1;
  pointer-events:none;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.about-card[data-depth="2"]{
  z-index:30;
  transform:
    translate3d(calc(28px + var(--pile-jx,0px)),calc(-2px + var(--pile-jy,0px)),0)
    rotate(calc(2.9deg + var(--pile-jr,0deg)))
    scale(.990);
  transform-origin:39% 90%;
  opacity:1;
  pointer-events:none;
  box-shadow:0 10px 20px rgba(0,0,0,.07);
}

.about-card[data-depth="3"]{
  z-index:20;
  transform:
    translate3d(calc(-36px + var(--pile-jx,0px)),calc(18px + var(--pile-jy,0px)),0)
    rotate(calc(-4.0deg + var(--pile-jr,0deg)))
    scale(.982);
  transform-origin:67% 86%;
  opacity:1;
  pointer-events:none;
  box-shadow:0 12px 22px rgba(0,0,0,.06);
}

.about-card[data-depth="4"]{
  z-index:10;
  transform:
    translate3d(calc(39px + var(--pile-jx,0px)),calc(25px + var(--pile-jy,0px)),0)
    rotate(calc(4.8deg + var(--pile-jr,0deg)))
    scale(.975);
  transform-origin:34% 89%;
  opacity:1;
  pointer-events:none;
  box-shadow:0 14px 24px rgba(0,0,0,.05);
}

.about-card.is-dragging{
  transition:none;
  cursor:grabbing;
}

/* Temporary card labels for logic testing */
.about-card::after{
  content:"CARD " attr(data-card);
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#111;
  font:700 clamp(28px,5vw,64px)/1 Arial,Helvetica,sans-serif;
  letter-spacing:-.04em;
  pointer-events:none;
}

/* MOBILE */
@media (max-width:767px){
  :root{
    --radius:25px;
    --stack-gap:8px;
  }

  .about-card-module{
    padding:20px 22px;
  }

  .about-card-stack{
    /* Height drives size so the portrait ratio can never flip */
    height:min(68dvh, 560px);
    max-width:86vw;
  }


  .about-card[data-depth="1"]{
    transform:translate3d(-15px,-7px,0) rotate(-1.8deg) scale(.996);
  }
  .about-card[data-depth="2"]{
    transform:translate3d(20px,-1px,0) rotate(2.4deg) scale(.992);
  }
  .about-card[data-depth="3"]{
    transform:translate3d(-25px,13px,0) rotate(-3.2deg) scale(.985);
  }
  .about-card[data-depth="4"]{
    transform:translate3d(28px,18px,0) rotate(3.7deg) scale(.979);
  }

}

/* TABLET */
@media (min-width:768px) and (max-width:1199px){
  :root{
    --radius:30px;
    --stack-gap:10px;
  }

  .about-card-module{
    padding:36px 44px;
  }

  .about-card-stack{
    height:min(72dvh, 700px);
    max-width:58vw;
  }
}

/* DESKTOP */
@media (min-width:1200px){
  :root{
    --radius:34px;
    --stack-gap:12px;
  }

  .about-card-module{
    padding:48px;
  }

  .about-card-stage{
    cursor:grab;
  }

  .about-card-stack{
    height:min(76dvh, 820px);
    max-width:36vw;
  }
}

@media (prefers-reduced-motion:reduce){
  .about-card{transition:none!important}
}


/* =========================================================
   HORIZONTAL STRAIGHT-CAROUSEL MODE
   Tablet landscape + desktop.
   All five cards stay visible.
   Active card is centered; adjacent cards are more exposed;
   outer cards sit farther out on the same horizontal line.
   ========================================================= */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){

  .about-card-module{
    padding:40px 54px;
    overflow:hidden;
  }

  .about-card-stage{
    width:100%;
    min-height:min(78vh,860px);
    display:grid;
    place-items:center;
  }

  .about-card-stack{
    height:min(66vh,700px);
    max-width:none;
  }

  /* Center / selected */
  .about-card[data-depth="0"]{
    z-index:50;
    transform:translate3d(0,0,0) rotate(-0.45deg) scale(1);
    opacity:1;
  }

  /* Next card — near right, strongly visible */
  .about-card[data-depth="1"]{
    z-index:40;
    transform:translate3d(74%,0,0) rotate(1.65deg) scale(.8721);
    transform-origin:50% 50%;
    opacity:.96;
    box-shadow:0 12px 24px rgba(0,0,0,.07);
  }

  /* Second next — far right, more tucked away */
  .about-card[data-depth="2"]{
    z-index:20;
    transform:translate3d(124%,0,0) rotate(-2.15deg) scale(.7182);
    transform-origin:50% 50%;
    opacity:.70;
    box-shadow:0 12px 22px rgba(0,0,0,.045);
  }

  /* Second previous — far left */
  .about-card[data-depth="3"]{
    z-index:19;
    transform:translate3d(-124%,0,0) rotate(-3.10deg) scale(.7182);
    transform-origin:50% 50%;
    opacity:.70;
    box-shadow:0 12px 22px rgba(0,0,0,.045);
  }

  /* Previous card — near left, strongly visible */
  .about-card[data-depth="4"]{
    z-index:39;
    transform:translate3d(-74%,0,0) rotate(0.85deg) scale(.8721);
    transform-origin:50% 50%;
    opacity:.96;
    box-shadow:0 12px 24px rgba(0,0,0,.07);
  }
}


  
  /* Keep every card fully opaque; inactive-state emphasis comes from filter only. */
  .about-card[data-depth="0"],
  .about-card[data-depth="1"],
  .about-card[data-depth="2"],
  .about-card[data-depth="3"],
  .about-card[data-depth="4"]{
    opacity:1 !important;
  }

/* Dim all non-selected cards while keeping the centered card fully bright. */
  .about-card[data-depth="1"],
  .about-card[data-depth="2"],
  .about-card[data-depth="3"],
  .about-card[data-depth="4"]{
    filter:brightness(.80) saturate(.92);
    transition:
      transform 360ms cubic-bezier(.18,.86,.22,1),
      opacity 220ms ease,
      filter 320ms ease;
  }

  .about-card[data-depth="0"]{
    transform:translate3d(0,0,0) rotate(-0.45deg) scale(1);
    filter:brightness(1) saturate(1);
    z-index:60;
  }

  /* Adjacent cards stay more readable than the two outer cards. */
  .about-card[data-depth="1"],
  .about-card[data-depth="4"]{
    filter:brightness(.90) saturate(.97);
    box-shadow:0 10px 22px rgba(0,0,0,.07);
  }

  .about-card[data-depth="2"],
  .about-card[data-depth="3"]{
    filter:brightness(.78) saturate(.93);
    box-shadow:0 8px 18px rgba(0,0,0,.05);
  }

/* Wider desktop: spread the straight line slightly more */
@media (min-width:1400px){
  .about-card-module{
    padding-left:24px;
    padding-right:24px;
  }

  .about-card-stage{
    width:100vw;
    max-width:none;
  }

  .about-card-stack{
    /* Bigger active card on PC */
    height:min(84vh,980px);
    max-width:none;
  }

  /* Near cards */
  .about-card[data-depth="1"]{
    transform:translate3d(86%,0,0) rotate(1.65deg) scale(.8721);
  }
  .about-card[data-depth="4"]{
    transform:translate3d(-86%,0,0) rotate(0.85deg) scale(.8721);
  }

  /* Outer cards push toward the viewport edges */
  .about-card[data-depth="2"]{
    transform:translate3d(146%,0,0) rotate(-2.15deg) scale(.7182);
  }
  .about-card[data-depth="3"]{
    transform:translate3d(-146%,0,0) rotate(-3.10deg) scale(.7182);
  }
}

/* Extra-wide monitors: let the five-card line breathe across the full screen. */
@media (min-width:1800px){
  .about-card-stack{
    height:min(86vh,1040px);
  }

  .about-card[data-depth="1"]{
    transform:translate3d(90%,0,0) rotate(1.65deg) scale(.8721);
  }
  .about-card[data-depth="4"]{
    transform:translate3d(-90%,0,0) rotate(0.85deg) scale(.8721);
  }
  .about-card[data-depth="2"]{
    transform:translate3d(152%,0,0) rotate(-2.15deg) scale(.7182);
  }
  .about-card[data-depth="3"]{
    transform:translate3d(-152%,0,0) rotate(-3.10deg) scale(.7182);
  }
}


/* Final straight-carousel spacing tune */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){
  .about-card-module{
    overflow:hidden;
  }

  .about-card-stage{
    width:100%;
    max-width:none;
  }

  .about-card[data-depth="0"],
  .about-card[data-depth="1"],
  .about-card[data-depth="2"],
  .about-card[data-depth="3"],
  .about-card[data-depth="4"]{
    top:0;
    bottom:0;
    margin:auto;
  }
}


/* Linear organic layout: same baseline, non-mirrored angles */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){
  .about-card[data-depth="0"]{ transform-origin:48% 58%; }
  .about-card[data-depth="1"]{ transform-origin:44% 84%; }
  .about-card[data-depth="2"]{ transform-origin:58% 79%; }
  .about-card[data-depth="3"]{ transform-origin:67% 86%; }
  .about-card[data-depth="4"]{ transform-origin:39% 82%; }
}


/* Middle-align every carousel card while preserving organic rotation */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){
  .about-card-stage{
    position:relative;
  }

  .about-card{
    top:50% !important;
    bottom:auto !important;
    margin:0 !important;
  }

  .about-card[data-depth="0"]{
    transform:translate3d(0,-50%,0) rotate(-0.45deg) scale(1.05) !important;
  }

  .about-card[data-depth="1"]{
    transform:translate3d(86%,-50%,0) rotate(1.65deg) scale(.9157) !important;
  }

  .about-card[data-depth="4"]{
    transform:translate3d(-86%,-50%,0) rotate(.85deg) scale(.9157) !important;
  }

  .about-card[data-depth="2"]{
    transform:translate3d(146%,-50%,0) rotate(-2.15deg) scale(.7541) !important;
  }

  .about-card[data-depth="3"]{
    transform:translate3d(-146%,-50%,0) rotate(-3.10deg) scale(.7541) !important;
  }
}

/* Extra-wide PC keeps the same midpoint alignment with wider spread */
@media (min-width:1800px){
  .about-card[data-depth="1"]{
    transform:translate3d(90%,-50%,0) rotate(1.65deg) scale(.9157) !important;
  }

  .about-card[data-depth="4"]{
    transform:translate3d(-90%,-50%,0) rotate(.85deg) scale(.9157) !important;
  }

  .about-card[data-depth="2"]{
    transform:translate3d(152%,-50%,0) rotate(-2.15deg) scale(.7541) !important;
  }

  .about-card[data-depth="3"]{
    transform:translate3d(-152%,-50%,0) rotate(-3.10deg) scale(.7541) !important;
  }
}


/* TRUE visual middle alignment
   Rotation happens around each card's exact center, so every scaled/tilted card
   shares one horizontal midpoint. */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){

  .about-card-stack{
    position:relative;
  }

  .about-card{
    top:50% !important;
    bottom:auto !important;
    left:0 !important;
    right:0 !important;
    margin:0 !important;
    transform-origin:50% 50% !important;
  }

  .about-card[data-depth="0"]{
    transform:translate3d(0,-50%,0) rotate(-0.45deg) scale(1.05) !important;
  }

  .about-card[data-depth="1"]{

  .about-card[data-depth="2"]{

  .about-card[data-depth="3"]{
    transform:translate3d(-146%,-50%,0) rotate(-3.10deg) scale(.7541) !important;
  }
}

@media (min-width:1800px){
  .about-card[data-depth="1"]{
    transform:translate3d(90%,-50%,0) rotate(1.65deg) scale(.9157) !important;
  }

  .about-card[data-depth="4"]{
    transform:translate3d(-90%,-50%,0) rotate(.85deg) scale(.9157) !important;
  }

  .about-card[data-depth="2"]{

  }

  .about-card[data-depth="3"]{
    transform:translate3d(-152%,-50%,0) rotate(-3.10deg) scale(.7541) !important;
  }
}


/* Balanced spread:
   100 / 85 / 65 scale hierarchy with deliberate, even overlap.
   This replaces the "dissipated" spacing with geometry-based spacing. */
@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){

  .about-card-stage{
    --near-x:90%;
    --far-x:165%;
    width:100vw !important;
    max-width:none !important;
  }

  .about-card{
    top:50% !important;
    bottom:auto !important;
    left:0 !important;
    right:0 !important;
    margin:0 !important;
    transform-origin:50% 50% !important;
  }

  .about-card[data-depth="0"]{
    transform:translate3d(0,-50%,0) rotate(-0.45deg) scale(1.05) !important;
  }

  .about-card[data-depth="1"]{
    transform:translate3d(var(--near-x),-50%,0) rotate(1.65deg) scale(.9157) !important;
  }

  .about-card[data-depth="4"]{
    transform:translate3d(calc(-1 * var(--near-x)),-50%,0) rotate(.85deg) scale(.9157) !important;
  }

  .about-card[data-depth="2"]{
    transform:translate3d(var(--far-x),-50%,0) rotate(-2.15deg) scale(.7541) !important;
  }

  .about-card[data-depth="3"]{
    transform:translate3d(calc(-1 * var(--far-x)),-50%,0) rotate(-3.10deg) scale(.7541) !important;
  }
}

/* Slightly wider on very large screens, but keep the overlap relationships intact */
@media (min-width:1800px){
  .about-card-stage{
    --near-x:94%;
    --far-x:173%;
  }
}


@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){
  .about-card[data-depth="0"]{ cursor:grab; }
  .about-card[data-depth="0"].is-dragging{ cursor:grabbing; }
}

@media (min-width:900px) and (orientation:landscape),
       (min-width:1200px){
  .about-card[data-depth="0"]{
    pointer-events:auto !important;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
}

<script>
(()=>{
const stage=document.getElementById('aboutCardStage');const stack=document.getElementById('aboutCardStack');let cards=[...stack.querySelectorAll('.about-card')];
let pointerId=null,startX=0,startY=0,dx=0,dy=0,dragging=false,gesture=null,locked=false;
const AXIS_LOCK=10,SWIPE_DISTANCE=82,MAX_ROTATION=1.2;
const currentCard=()=>cards[0]||null;
let pileTick=0;
const pileJitter=[
  [0,0,0],
  [1,0,.07],
  [-1,1,-.06],
  [0,-1,.04],
  [1,1,-.05]
];

function layout(){
  cards.forEach((card,depth)=>{
    card.dataset.depth=String(Math.min(depth,4));
    card.style.pointerEvents=depth===0?'auto':'none';

    if(depth>0){
      const j=pileJitter[(pileTick + Number(card.dataset.card||0)) % pileJitter.length];
      card.style.setProperty('--pile-jx', `${j[0]}px`);
      card.style.setProperty('--pile-jy', `${j[1]}px`);
      card.style.setProperty('--pile-jr', `${j[2]}deg`);
    }

    if(!card.classList.contains('is-dragging')){
      card.style.removeProperty('opacity');
    }
  });
}
function isInteractiveElement(target){return !!target.closest('button,a,input,textarea,select,summary,[role="button"],[data-no-card-swipe]')}
function resetGesture(){pointerId=null;startX=startY=dx=dy=0;dragging=false;gesture=null}
function snapBack(card){
  if(!card)return;
  card.classList.remove('is-dragging');
  card.style.setProperty(
    'transition',
    'transform 260ms cubic-bezier(.2,.8,.2,1), opacity 220ms ease',
    'important'
  );

  if(isHorizontalCarousel()){
    card.style.setProperty(
      'transform',
      'translate3d(0,-50%,0) rotate(-0.45deg) scale(1.05)',
      'important'
    );
  }else{
    card.style.setProperty(
      'transform',
      'translate3d(0,0,0) rotate(0deg)',
      'important'
    );
  }

  card.style.setProperty('opacity','1','important');
  setTimeout(()=>{
    card.style.removeProperty('transition');
    card.style.removeProperty('transform');
    card.style.removeProperty('opacity');
    resetGesture();
  },280);
}
function isHorizontalCarousel(){
  return window.matchMedia('(min-width:1200px), (min-width:900px) and (orientation:landscape)').matches;
}

function sendFrontCardToBack(direction){
  if(locked)return;

  /* Horizontal layouts behave like a real circular carousel:
     left = advance, right = go back. All five cards remain on screen. */
  if(isHorizontalCarousel()){
    locked=true;
    cards.forEach(card=>{
      card.classList.remove('is-dragging');
      card.style.removeProperty('transform');
      card.style.removeProperty('opacity');
    });

    if(direction==='right'){
      cards.unshift(cards.pop());
    }else{
      cards.push(cards.shift());
    }

    pileTick=(pileTick+1)%11;
    resetGesture();
    requestAnimationFrame(()=>{
      layout();
      setTimeout(()=>{locked=false},380);
    });
    return;
  }

  /* Portrait/mobile keeps the swipe-away behavior we already approved. */
  const card=currentCard();
  if(!card)return;
  locked=true;
  const sign=direction==='right'?1:-1;
  const travel=Math.max(stage.clientWidth*1.18,520);
  card.classList.remove('is-dragging');
  card.style.transition='transform 290ms cubic-bezier(.2,.75,.2,1), opacity 210ms ease';
  card.style.transform=`translate3d(${sign*travel}px,${dy*.025}px,0) rotate(${sign*2.4}deg)`;
  card.style.opacity='0';
  setTimeout(()=>{
    cards.push(cards.shift());
    stack.appendChild(card);
    card.style.removeProperty('transition');
    card.style.removeProperty('transform');
    card.style.removeProperty('opacity');
    resetGesture();
    pileTick=(pileTick+1)%11;
    layout();
    requestAnimationFrame(()=>{locked=false});
  },255);
}
function onPointerDown(e){const card=currentCard();if(!card||locked||isInteractiveElement(e.target))return;pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;dx=dy=0;dragging=true;gesture=null;card.setPointerCapture?.(pointerId)}
function onPointerMove(e){
  if(!dragging||locked||e.pointerId!==pointerId)return;
  const card=currentCard();
  if(!card)return;

  dx=e.clientX-startX;
  dy=e.clientY-startY;

  if(!gesture){
    if(Math.abs(dx)<AXIS_LOCK&&Math.abs(dy)<AXIS_LOCK)return;
    gesture=Math.abs(dx)>Math.abs(dy)*1.15?'horizontal':'vertical';
  }

  if(gesture==='vertical')return;
  e.preventDefault();
  card.classList.add('is-dragging');

  if(isHorizontalCarousel()){
    /* Keep the selected card visually centered on the same middle axis,
       then add the live pointer translation on top of that base position. */
    const dragTilt=Math.max(-2.4,Math.min(2.4,dx/85));
    card.style.setProperty('transition','none','important');
    card.style.setProperty(
      'transform',
      `translate3d(${dx}px,-50%,0) rotate(${(-0.45+dragTilt).toFixed(3)}deg) scale(1.05)`,
      'important'
    );
    card.style.setProperty('opacity','1','important');
  }else{
    const rotation=Math.max(-MAX_ROTATION,Math.min(MAX_ROTATION,dx/55));
    card.style.transform=`translate3d(${dx}px,${dy*.02}px,0) rotate(${rotation}deg)`;
    card.style.opacity=String(1-Math.min(.10,Math.abs(dx)/1100));
  }
}
function onPointerUp(e){if(!dragging||e.pointerId!==pointerId)return;const card=currentCard();if(!card){resetGesture();return}if(gesture!=='horizontal'){card.classList.remove('is-dragging');resetGesture();return}if(Math.abs(dx)>=SWIPE_DISTANCE)sendFrontCardToBack(dx>0?'right':'left');else snapBack(card)}
stage.addEventListener('pointerdown',onPointerDown);stage.addEventListener('pointermove',onPointerMove,{passive:false});stage.addEventListener('pointerup',onPointerUp);stage.addEventListener('pointercancel',onPointerUp);
stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();sendFrontCardToBack('left')}if(e.key==='ArrowRight'){e.preventDefault();sendFrontCardToBack('right')}});
layout();
})();
</script>
<script id="corrected-bridge-card1-scale">
(function(){
  const BASE_W=2945, BASE_H=4962;
  function fitBridge(){
    document.querySelectorAll('.card1-bridge-host').forEach(host=>{
      const src=host.querySelector('.card1-bridge-source');
      if(!src) return;
      const w=host.clientWidth, h=host.clientHeight;
      if(!w || !h) return;
      const s=Math.min(w/BASE_W,h/BASE_H);
      src.style.transform='scale('+s+')';
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fitBridge); else fitBridge();
  window.addEventListener('resize',fitBridge,{passive:true});
  if('ResizeObserver' in window){
    const ro=new ResizeObserver(fitBridge);
    document.querySelectorAll('.card1-bridge-host').forEach(el=>ro.observe(el));
  }
